# docker-compose.yml
version: "3.8"
services:
  db:
    image: postgres:15
    container_name: kakeibo-db
    environment:
      POSTGRES_USER: adonis
      POSTGRES_PASSWORD: adonis
      POSTGRES_DB: kakeibo
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
